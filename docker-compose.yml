x-app-environment: &app-environment
    TERM: "xterm-256color"
    NODE_ENV: "development"
    NYINGARN_ENV: "dev"
    LOG_LEVEL: "debug"
    DB_HOST: "db"
    DB_PORT: "5432"
    DB_USER: "root"
    DB_PASSWORD: ""
    DB_DATABASE: "nyingarn"
    SESSION_SECRET: "${SESSION_SECRET:-dev-only-session-secret-not-for-production}"
    S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-nyingarn-dev}"
    S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-nyingarn-dev-secret}"
    AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
    AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
    RABBIT_USER: "guest"
    RABBIT_PASS: "guest"

volumes:
    api_node_modules:
        driver: local
    ui_node_modules:
        driver: local
    S3_DATA_VOLUME:
        driver: local
    TUS_VOLUME:
        driver: local

services:
    db:
        image: postgres:18-alpine
        hostname: db
        tty: true
        environment:
            TERM: "xterm-256color"
            NODE_ENV: "development"
            POSTGRES_DB: "nyingarn"
            POSTGRES_USER: "root"
            POSTGRES_PASSWORD: ""
            POSTGRES_HOST_AUTH_METHOD: "trust"

    s3:
        image: ghcr.io/versity/versitygw:v1.7.0
        restart: always
        environment:
            ROOT_ACCESS_KEY: "${S3_ACCESS_KEY_ID:-nyingarn-dev}"
            ROOT_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:-nyingarn-dev-secret}"
            VGW_PORT: ":9000"
            VGW_REGION: us-east-1
            VGW_HEALTH: /_health
        command: posix /data
        volumes:
            - S3_DATA_VOLUME:/data

    rabbit:
        image: rabbitmq:3-management
        hostname: rabbit
        restart: always
        ports:
            - 15672:15672

    mail:
        image: axllent/mailpit:latest
        hostname: mail
        restart: always
        ports:
            - 8025:8025

    rabbit-worker1:
        image: node:18-bookworm
        hostname: worker1
        restart: always
        working_dir: /srv/tasks
        environment:
            <<: *app-environment
            POST_FINISH: "http://api:8080/process/post-finish"
        volumes:
            - api_node_modules:/srv/api/node_modules:delegated
            - ./tasks:/srv/tasks:delegated
            - ./saxon-test:/srv/saxon-test:delegated
            - ./api:/srv/api:delegated
            - ./.git:/srv/tasks/.git:delegated
            - ./.git:/srv/api/.git:delegated
            - ./scripts/wait-for-it.sh:/wait-for-it.sh
            - ./configuration:/srv/configuration
        command: ["/wait-for-it.sh", "rabbit:15672", "--", "npm", "run", "develop"]

    api:
        image: node:18-bookworm
        hostname: api
        tty: true
        environment: *app-environment
        volumes:
            - api_node_modules:/srv/api/node_modules:delegated
            - ./api:/srv/api:delegated
            - ./profiles:/srv/profiles:delegated
            - ./.git:/srv/api/.git:delegated
            - ./scripts/wait-for-it.sh:/wait-for-it.sh
            - ./configuration:/srv/configuration
        working_dir: /srv/api
        command: ["/wait-for-it.sh", "db:5432", "--", "npm", "run", "develop"]

    ui:
        image: node:18-bookworm
        hostname: ui
        tty: true
        environment:
            TERM: "xterm-256color"
            NODE_ENV: "development"
        volumes:
            # - ui_node_modules:/srv/ui/node_modules:delegated
            - ./ui:/srv/ui:delegated
            - .git:/srv/ui/.git:delegated
        working_dir: /srv/ui
        command: ["npm", "run", "develop"]

    ui-repository:
        image: node:18-bookworm
        hostname: ui-repository
        tty: true
        environment:
            TERM: "xterm-256color"
            NODE_ENV: "development"
        volumes:
            # - ui_node_modules:/srv/ui/node_modules:delegated
            - ./ui-repository:/srv/ui:delegated
            - .git:/srv/ui/.git:delegated
        working_dir: /srv/ui
        command: ["npm", "run", "develop"]

    elastic:
        build: elastic
        hostname: elastic
        environment:
            - discovery.type=single-node
            - ES_JAVA_OPTS=-Xms750m -Xmx750m
            - xpack.security.enabled=false
            - node.name=search
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        cap_add:
            - IPC_LOCK

    edge:
        image: nginx:latest
        hostname: edge
        tty: true
        environment:
            TERM: "xterm-256color"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - ./scripts/wait-for-it.sh:/wait-for-it.sh
        command: ["/wait-for-it.sh", "api:8080", "-t", "10", "--", "nginx", "-g", "daemon off;"]
        ports:
            - 9000:9000
            - 9001:9001

    xml-processor:
        image: tomcat:9.0.76-jdk21-openjdk-slim
        hostname: xml
        tty: true
        environment:
            TERM: "xterm-256color"
        volumes:
            - ./xml:/srv/xml
            - ./xml/tomcat-config:/usr/local/tomcat/conf/Catalina/localhost/
        restart: unless-stopped
